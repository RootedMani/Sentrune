[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrune"
version = "0.1.0"
description = "Sentrune: free-tier market intelligence and explainable prediction prototype for retail traders"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pandas>=2.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "yfinance>=0.2.40",
  "praw>=7.7",
  "pandas-ta>=0.3.14b0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "lightgbm>=4.0",
  "streamlit>=1.49",
  "streamlit-autorefresh>=1.0.1",
]

[project.optional-dependencies]
# Real FinBERT scoring (heavy); tests and the technical/aggregation paths run without it.
finbert = ["transformers>=4.40", "torch>=2.0"]
# Optional research-only LSTM comparison; not needed for LightGBM, baselines, or tests.
research = ["torch>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
trading-ingest = "trading_assistant.ingest.pipeline:main"
feature-compute = "trading_assistant.features.compute:main"
model-train = "trading_assistant.modeling.compute:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trading_assistant*"]

[tool.setuptools.package-data]
"*" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
