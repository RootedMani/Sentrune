# Path is relative to the feature-engineering working directory.
db_path: data/trading_assistant.sqlite3
intervals: [1d]
# Empty means all active assets in the data-layer assets table.
assets: []
indicators: [sma, ema, macd, rsi, stoch, bollinger, atr, obv, volume_sma, adx, ichimoku, candles, volatility_divergence]
sentiment_windows_hours: [24, 168]
finbert_model: ProsusAI/finbert
sentiment_batch_size: 16
# Technical feature windows. Horizons are measured in bars.
lag_horizons: [1, 3, 6, 12, 24]
zscore_window: 20
vol_window: 20
vol_rank_window: 252
# Crypto trades every day; stocks use the standard 252-session year.
high_low_window_crypto: 365
high_low_window_stock: 252
